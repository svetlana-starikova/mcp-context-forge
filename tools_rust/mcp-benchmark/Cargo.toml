[package]
name = "mcp-benchmark"
version = "0.1.0"
edition = "2021"
description = "MCP Tools Benchmark using Goose load testing framework"
authors = ["ContextForge Team"]
license = "Apache-2.0"

[dependencies]
goose = { version = "0.17", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
